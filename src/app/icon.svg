<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="glass">
      <path d="M20 20 L44 20 L40 53 Q39.6 56 36.6 56 L27.4 56 Q24.4 56 24 53 Z" />
    </clipPath>
  </defs>

  <!-- Light plate: the file convention emits one icon with no dark-scheme
       variant, so the mark must read against any tab strip colour. -->
  <rect width="64" height="64" rx="14" fill="#F5F5F7" />

  <!-- straw (carries the accent colour) -->
  <line x1="36" y1="22" x2="49" y2="6" stroke="#0071E3" stroke-width="4.5" stroke-linecap="round" />

  <!-- drink fill -->
  <g clip-path="url(#glass)">
    <rect x="0" y="0" width="64" height="64" fill="#E3CBA5" />
    <rect x="0" y="37" width="64" height="27" fill="#6B4A33" />
    <!-- ice cubes -->
    <rect x="24" y="27" width="9" height="9" rx="2" fill="#F5EEE0" opacity="0.85" transform="rotate(-12 28.5 31.5)" />
    <rect x="33" y="32" width="9" height="9" rx="2" fill="#F5EEE0" opacity="0.85" transform="rotate(10 37.5 36.5)" />
  </g>

  <!-- glass outline -->
  <path d="M20 20 L44 20 L40 53 Q39.6 56 36.6 56 L27.4 56 Q24.4 56 24 53 Z" stroke="#4A3526" stroke-width="2.5" stroke-linejoin="round" />
</svg>
